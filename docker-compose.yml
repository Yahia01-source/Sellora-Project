version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sellora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellora_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-sellora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sellora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: sellora_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-sellora_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sellora_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sellora_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sellora_network:
    driver: bridge
